# The hourly trigger for Yumi's reminder, which Vercel cannot give us.
#
# The reminder is due at eight in the evening *where the reader is*, and the
# route decides that for itself — see REMINDER_LOCAL_HOUR in
# app/api/cron/yumi-reminders/route.ts. To honour it for more than one band of
# timezones, something has to knock on the door every hour.
#
# Vercel's Hobby plan triggers a cron once a day and allows two of them, and
# both are spoken for (daily-news and this one). So the hourly cadence comes
# from here instead, which costs nothing and needs no plan change. The entry
# in vercel.json stays as a daily backstop: the delivery claim is keyed on the
# user and their local date, so a second knock in the same local day finds the
# work already done and reports it as a duplicate.
#
# Two things to know about this schedule. GitHub runs it on a best-effort
# basis and it can arrive several minutes late, which does not matter for a
# gate expressed in whole hours. And GitHub disables scheduled workflows in a
# repository with no activity for sixty days — if the reminders ever go quiet
# for no other reason, look here first.
#
# Setup, once:
#   1. Add a repository secret CRON_SECRET, matching the value in Vercel's
#      environment variables for the production deployment.
#   2. Optionally add a repository variable PRODUCTION_URL if the app ever
#      moves off the domain defaulted to below.

name: Yumi reminders

on:
  schedule:
    # Every hour, on the hour. The route decides who that hour is for.
    - cron: "0 * * * *"
  # So a run can be forced from the Actions tab when something looks wrong.
  workflow_dispatch:

# One run at a time. A late run overlapping the next would have both racing
# for the same delivery claims — which is safe, but the log is easier to read
# when it cannot happen.
concurrency:
  group: yumi-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ask the app to send this hour's reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://exchange-notes-app.vercel.app' }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not set on this repository."
            echo "Add it under Settings → Secrets and variables → Actions,"
            echo "using the same value as the Vercel production environment."
            exit 1
          fi

          # --fail-with-body so a 401 or a 500 fails the run and still prints
          # what the route said. A reminder job that quietly stops working is
          # the thing this whole change exists to prevent.
          curl --silent --show-error --fail-with-body \
            --max-time 90 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/cron/yumi-reminders"

          echo
