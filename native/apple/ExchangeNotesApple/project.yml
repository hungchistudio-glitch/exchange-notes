name: ExchangeNotesApple

options:
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0

targets:
  ExchangeNotes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: App
        excludes:
          - ExchangeNotes.entitlements
      - path: Shared

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.hungchi.exchangenotes
        PRODUCT_NAME: ExchangeNotes
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/ExchangeNotes.entitlements
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Exchange Notes
        NSCameraUsageDescription: "Exchange Notes uses the camera to identify objects and create vocabulary cards."
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.education
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: art.hungchi.exchangenotes
            CFBundleURLSchemes:
              - exchangenotes

    dependencies:
      - target: YumiWidgetExtension

  YumiWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: Widget
        excludes:
          - Resources
          - YumiWidgetExtension.entitlements
      - path: Widget/Resources
        buildPhase: resources
      - path: Shared

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.hungchi.exchangenotes.yumiwidget
        PRODUCT_NAME: YumiWidgetExtension
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Widget/YumiWidgetExtension.entitlements

    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Yumi
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  ExchangeNotes:
    build:
      targets:
        ExchangeNotes: all
        YumiWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
